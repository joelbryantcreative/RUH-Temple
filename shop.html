<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — RŪḤ Temple</title>
<link rel="icon" href="Black Favicon 2.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="White Favicon.png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="Black Favicon 2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'SF Pro Display';
    src: url('SF-Pro-Display-Light.otf') format('opentype');
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; background: #fff; }

  body {
    background: #fff;
    color: #1a1a1a;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ANNOUNCEMENT BAR */
  .announcement-bar {
    background: #1a1a1a;
    color: rgba(255,255,255,0.85);
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.11em;
    text-align: center;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    position: relative;
    z-index: 400;
    text-transform: uppercase;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    z-index: 300;
    height: 100px;
    padding: 0 60px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: #fff;
    border-bottom: 1px solid rgba(0,0,0,0.18);
  }
  .nav-logo-img { height: 72px; width: auto; display: block; }
  .nav-logo {
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 13px; font-weight: 300;
    letter-spacing: 0.28em; color: #1a1a1a;
    text-decoration: none; text-align: center;
    white-space: nowrap; grid-column: 2;
  }
  .nav-links { display: flex; gap: 48px; list-style: none; grid-column: 1; }
  .nav-links a {
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 14px; font-weight: 300;
    letter-spacing: 0.02em; color: #2a2a2a;
    text-decoration: none; transition: color 0.3s;
  }
  .nav-links a:hover, .nav-links a.active { color: #000; }
  .nav-right {
    grid-column: 3;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 20px;
  }
  .nav-cart {
    background: none; border: none; cursor: pointer;
    padding: 4px; display: flex; align-items: center;
    color: #2a2a2a; transition: color 0.3s;
  }
  .nav-cart:hover { color: #000; }
  .nav-cart svg { display: block; }

  /* HAMBURGER */
  .hamburger {
    display: none; flex-direction: column; gap: 5px;
    background: none; border: none; cursor: pointer; padding: 4px;
  }
  .hamburger span { display: block; width: 22px; height: 1px; background: #1a1a1a; transition: all 0.3s; }
  .mobile-nav {
    display: none; position: fixed; inset: 0;
    background: rgba(255,255,255,0.98); z-index: 500;
    flex-direction: column; align-items: center; justify-content: center; gap: 40px;
  }
  .mobile-nav.open { display: flex; }
  .mobile-nav-link {
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 13px; letter-spacing: 0.25em;
    color: #2a2a2a; text-decoration: none;
    text-transform: uppercase; transition: color 0.4s;
  }
  .mobile-nav-link:hover { color: #000; }

  @media (max-width: 768px) {
    nav { padding: 0 24px; }
    .nav-links { display: none; }
    .hamburger { display: flex; }
  }

  /* PAGE HEADER */
  .shop-header {
    padding: 64px 60px 48px;
    text-align: center;
  }
  .shop-title {
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 400;
    letter-spacing: 0.3em;
    color: #1a1a1a;
    text-transform: uppercase;
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 0 60px 48px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    margin-bottom: 0;
  }
  .filter-btn {
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.22em;
    color: #888;
    text-transform: uppercase;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: color 0.3s, border-color 0.3s;
  }
  .filter-btn:hover, .filter-btn.active {
    color: #1a1a1a;
    border-bottom-color: #1a1a1a;
  }

  /* PRODUCT GRID */
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }

  .shop-tile {
    display: block;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
  }

  .shop-tile-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: #f5f3f0;
  }

  .shop-tile-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease;
  }

  .shop-tile:hover .shop-tile-img-wrap img {
    transform: scale(1.03);
  }

  /* Bottom label bar — always visible */
  .shop-tile-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-top: 1px solid rgba(0,0,0,0.07);
  }

  .shop-tile-type {
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #1a1a1a;
  }

  .shop-tile-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.05em;
    color: #1a1a1a;
  }

  /* "Coming Soon" badge for unavailable items */
  .shop-tile-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(26,26,26,0.75);
    padding: 4px 10px;
  }

  /* Hover add-to-cart overlay */
  .shop-tile-hover {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    color: #fff;
    font-family: 'SF Pro Display', 'Cinzel', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-align: center;
    padding: 16px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    /* sits above the label bar */
    margin-bottom: 49px;
  }

  .shop-tile:hover .shop-tile-hover {
    transform: translateY(0);
  }

  @media (max-width: 900px) {
    .shop-grid { grid-template-columns: repeat(2, 1fr); }
    .shop-header { padding: 48px 24px 32px; }
    .filter-bar { padding: 0 24px 36px; gap: 24px; }
  }

  @media (max-width: 500px) {
    .shop-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="mobile-nav" id="mobileNav">
  <a href="shop.html" class="mobile-nav-link">Shop</a>
  <a href="about.html" class="mobile-nav-link">About</a>
  <a href="contact.html" class="mobile-nav-link">Contact</a>
</div>

<div class="announcement-bar">NEW ANCIENT — TERRE NATALE<a href="product.html" style="color:inherit;text-decoration:underline;text-underline-offset:3px;margin-left:0.35em;">AVAILABLE NOW</a></div>

<nav>
  <ul class="nav-links">
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <a href="index.html" class="nav-logo">
    <img src="RUH Black.png" alt="RŪḤ Temple" class="nav-logo-img">
  </a>
  <div class="nav-right">
    <button class="nav-cart" aria-label="Cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
    </button>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="shop-header">
  <h1 class="shop-title">Shop</h1>
</div>


<div class="shop-grid">

  <!-- Terre Natale EDP -->
  <a href="product.html" class="shop-tile" data-shopify="terre-natale">
    <div class="shop-tile-img-wrap">
      <img src="Terre Natale Bottle.png" alt="Terre Natale Eau de Parfum">
    </div>
    <div class="shop-tile-hover">Add to cart</div>
    <div class="shop-tile-bar">
      <span class="shop-tile-type">Eau de Parfum</span>
      <span class="shop-tile-price">$300</span>
    </div>
  </a>


  <!-- Body Oil -->
  <div class="shop-tile" style="cursor:default;">
    <div class="shop-tile-img-wrap">
      <img src="Coming Soon - Body Oil.png" alt="Body Oil">
      <span class="shop-tile-badge">Coming Soon</span>
    </div>
    <div class="shop-tile-bar">
      <span class="shop-tile-type">Body Oil</span>
      <span class="shop-tile-price">—</span>
    </div>
  </div>

  <!-- Ritual Kit -->
  <div class="shop-tile" style="cursor:default;">
    <div class="shop-tile-img-wrap">
      <img src="Coming Soon - Ritual Kit.png" alt="Ritual Kit">
      <span class="shop-tile-badge">Coming Soon</span>
    </div>
    <div class="shop-tile-bar">
      <span class="shop-tile-type">Ritual Kit</span>
      <span class="shop-tile-price">—</span>
    </div>
  </div>

  <!-- Gift Cards -->
  <div class="shop-tile" style="cursor:default;">
    <div class="shop-tile-img-wrap">
      <img src="Gift Cards.png" alt="Gift Card">
    </div>
    <div class="shop-tile-bar">
      <span class="shop-tile-type">Gift Card</span>
      <span class="shop-tile-price">$35+</span>
    </div>
  </div>


</div>

<script>
  const hamburger = document.getElementById('hamburger');
  const mobileNav = document.getElementById('mobileNav');
  hamburger.addEventListener('click', () => {
    mobileNav.classList.toggle('open');
    document.body.style.overflow = mobileNav.classList.contains('open') ? 'hidden' : '';
  });
  document.querySelectorAll('.mobile-nav-link').forEach(link => {
    link.addEventListener('click', () => {
      mobileNav.classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>
<script src="shopify-cart.js"></script>
</body>
</html>
